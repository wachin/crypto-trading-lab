[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-trading-lab"
version = "0.0.0.dev0"
description = "Educational, research, and simulation platform for cryptocurrency markets (see ROADMAP.md)."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Crypto Trading Lab" }]
keywords = [
    "cryptocurrency",
    "backtesting",
    "quantitative-research",
    "trading",
    "education",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Office/Business :: Financial :: Investment",
]
# Declared so that a plain `pip install .` works on any platform, which is
# what Windows and macOS need. On Debian the supported path is still the
# system packages (python3-pyqt6, python3-pyqtgraph, python3-sqlalchemy,
# python3-platformdirs): inside a `--system-site-packages` venv pip sees
# those distributions and does not fetch PyPI copies.
# See docs/en/developers/venv-setup.md.
dependencies = [
    "PyQt6>=6.6",
    "pyqtgraph>=0.13",
    "SQLAlchemy>=2.0",
    "platformdirs>=4.0",
]

[project.urls]
Homepage = "https://github.com/wachin/crypto-trading-lab"
Repository = "https://github.com/wachin/crypto-trading-lab"
Issues = "https://github.com/wachin/crypto-trading-lab/issues"
Changelog = "https://github.com/wachin/crypto-trading-lab/blob/main/AGENT-HANDOFF.md"

[project.optional-dependencies]
# Credential storage (chapter 9). Imported lazily: without it the application
# runs and the in-memory store is used, and KeyringCredentialStore raises a
# message naming this extra.
credentials = ["keyring>=24.0"]
# PDF report export (chapter 41) is PyPI-only here.
pdf = ["pypdf>=4.0"]
# CCXT integration is optional until the chapter 4 packaging evaluation
# concludes (no python3-ccxt Debian package exists; see the CCXT study
# in docs/en/developers/reference-projects.md).
ccxt = ["ccxt>=4.0"]
# Async HTTP and WebSocket libraries for live market data (Chapter 26.2, 27)
# Optional until packaging evaluation concludes.
aiohttp = ["aiohttp>=3.9"]
websockets = ["websockets>=12.0"]
# Development tooling. In practice these are installed as Debian system
# packages (python3-pytest, python3-hypothesis, ...); this list exists for
# contributors who knowingly choose a virtual environment.
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "hypothesis>=6.130",
    "typeguard>=4.4",
]

[project.scripts]
crypto-trading-lab = "crypto_trading_lab.ui.main_window.window:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
crypto_trading_lab = [
    "i18n/translations/*.qm",
    "i18n/translations/*.ts",
    # Learning Center lesson figures (loaded at runtime by the UI).
    "education/assets/tutorial/*.png",
    "education/assets/tutorial/*.svg",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The suite must stay offline: a test that reaches the network is a bug.
addopts = "-ra"
markers = [
    "integration: end-to-end tests that wire several modules together (still fully offline)",
]
