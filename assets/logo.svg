<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Crypto Trading Lab logo: a laboratory flask holding a candlestick
       market. Survival first: the base of the flask is a shield. -->
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1b2a"/>
      <stop offset="1" stop-color="#1b3a5c"/>
    </linearGradient>
    <linearGradient id="liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a9d8f"/>
      <stop offset="1" stop-color="#1d6f64"/>
    </linearGradient>
  </defs>

  <!-- flask: neck + body -->
  <path d="M52 8 h24 v22 l26 52 a26 26 0 0 1 -23 38 h-30 a26 26 0 0 1 -23 -38 l26 -52 z"
        fill="url(#glass)" stroke="#e9f2f9" stroke-width="5" stroke-linejoin="round"/>

  <!-- liquid -->
  <path d="M37 70 h54 l9 15 a26 26 0 0 1 -21 35 h-30 a26 26 0 0 1 -21 -35 z"
        fill="url(#liquid)" opacity="0.92"/>

  <!-- candlesticks inside the liquid -->
  <g stroke-width="2.6" stroke-linecap="round">
    <!-- up candle -->
    <line x1="50" y1="66" x2="50" y2="106" stroke="#e9f2f9"/>
    <rect x="45" y="78" width="10" height="18" rx="1.5" fill="#57cc99"/>
    <!-- down candle -->
    <line x1="66" y1="62" x2="66" y2="104" stroke="#e9f2f9"/>
    <rect x="61" y="72" width="10" height="20" rx="1.5" fill="#ef6461"/>
    <!-- up candle -->
    <line x1="82" y1="58" x2="82" y2="100" stroke="#e9f2f9"/>
    <rect x="77" y="70" width="10" height="16" rx="1.5" fill="#57cc99"/>
  </g>

  <!-- measurement ticks on the flask neck: this lab measures -->
  <g stroke="#e9f2f9" stroke-width="2.4" stroke-linecap="round">
    <line x1="58" y1="16" x2="70" y2="16"/>
    <line x1="58" y1="24" x2="66" y2="24"/>
    <line x1="58" y1="32" x2="70" y2="32"/>
  </g>
</svg>
