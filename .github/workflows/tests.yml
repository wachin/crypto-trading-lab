name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (offscreen, Debian packages)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          # The external/ reference projects are not needed to test.
          submodules: false

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 python3-pyqt6 python3-pyqtgraph python3-sqlalchemy \
            python3-platformdirs python3-pytest qt6-l10n-tools \
            libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3

      - name: Show versions
        run: |
          python3 --version
          python3 -c "import PyQt6, pyqtgraph, sqlalchemy, platformdirs; print('deps OK')"

      - name: Run the test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: python3 -m pytest tests/ -q
